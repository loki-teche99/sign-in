<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    
    <!-- CSP Fix: Tells the browser it is safe to load Google's script libraries -->
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' https://google.com; frame-src https://google.com;">
    
    
    <script src="https://google.com/gsi/client" async defer></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffffff;
        }
        .container {
            text-align: center;
        }
        h1 {
            font-size: 32px;
            color: #1f1f1f;
            margin-bottom: 30px;
            font-weight: 500;
        }
        .button-wrapper {
            display: flex;
            justify-content: center;
            min-height: 50px; /* Prevents layout shifting when button loads */
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Dynamic Heading -->
        <h1 id="heading">Sign in</h1>
        
        <!-- Google Sign-In Button Container -->
        <div class="button-wrapper" id="auth-button-container">
            <!-- REPLACE THE CLIENT ID IN THE LINE BELOW -->
            <div id="g_id_onload"
                 data-client_id="88169519604-8l8enudk3ofqifabbmjug2cel8a11hg4.apps.googleusercontent.com"
                 data-context="signin"
                 data-ux_mode="popup"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>

            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="pill"
                 data-theme="outline"
                 data-text="signin_with"
                 data-size="large"
                 data-logo_alignment="left">
            </div>
        </div>
    </div>

    <script>
        // Decodes the Google JWT token in the client browser
        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));

                return JSON.parse(jsonPayload);
            } catch (error) {
                console.error("JWT Parse Error:", error);
                return null;
            }
        }

        // Triggers automatically when Google login succeeds
        function handleCredentialResponse(response) {
            const userProfile = parseJwt(response.credential);
            
            if (userProfile && userProfile.name) {
                // Change heading to display name
                document.getElementById('heading').innerText = `Welcome ${userProfile.name}!`;
                // Hide the sign-in button layout
                document.getElementById('auth-button-container').style.display = 'none';
            }

            // REPLACE WITH YOUR PORTFOLIO URL
            const portfolioUrl = "https://typebridge.42web.io/";
            
            // Redirect after 2 seconds
            setTimeout(() => {
                window.location.href = portfolioUrl;
            }, 2000);
        }
    </script>

</body>
</html>
