<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Sign-In</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #202124;
    }

    .container {
      width: min(90%, 420px);
      padding: 40px 28px;
      text-align: center;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 28px;
      font-size: 30px;
      line-height: 1.2;
    }

    #signin-container {
      display: flex;
      justify-content: center;
    }

    #signin-container > div {
      border-radius: 999px;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1 id="title">Sign in to continue</h1>

    <div id="signin-container">
      <div
        id="g_id_onload"
        data-client_id="88169519604-8l8enudk3ofqifabbmjug2cel8a11hg4.apps.googleusercontent.com"
        data-callback="handleCredentialResponse"
        data-auto_prompt="false">
      </div>

      <div
        class="g_id_signin"
        data-type="standard"
        data-shape="pill"
        data-theme="outline"
        data-text="signin_with"
        data-size="large"
        data-logo_alignment="left">
      </div>
    </div>
  </main>

  <script>
    function handleCredentialResponse(response) {
      try {
        const credential = response && response.credential;

        if (!credential) {
          throw new Error("Google credential was not received.");
        }

        const tokenParts = credential.split(".");

        if (tokenParts.length !== 3) {
          throw new Error("Invalid Google JWT.");
        }

        let encodedPayload = tokenParts[1];

        encodedPayload = encodedPayload
          .replace(/-/g, "+")
          .replace(/_/g, "/");

        while (encodedPayload.length % 4 !== 0) {
          encodedPayload += "=";
        }

        const decodedPayload = window.atob(encodedPayload);
        const userData = JSON.parse(decodedPayload);
        const userName = userData.name || "User";

        const titleElement = document.getElementById("title");
        const signinContainer = document.getElementById("signin-container");

        titleElement.textContent = `Welcome ${userName}!`;
        signinContainer.style.display = "none";

        setTimeout(function () {
          window.location.href = "https://typebridge.42web.io";
        }, 2000);
      } catch (error) {
        console.error("Google Sign-In error:", error);
      }
    }
  </script>
</body>
</html>
