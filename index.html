<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">

  <title>Sign In</title>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #202124;
      --muted: #6b7280;
      --border: #e5e7eb;
      --danger: #d93025;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at top, #ffffff 0%, var(--bg) 45%, #eef2f7 100%);
      color: var(--text);
    }

    .login-card {
      width: min(100%, 430px);
      padding: 42px 30px 32px;
      background: var(--card);
      border: 1px solid rgba(0, 0, 0, 0.05);
      border-radius: 24px;
      box-shadow:
        0 20px 60px rgba(15, 23, 42, 0.10),
        0 4px 16px rgba(15, 23, 42, 0.05);
      text-align: center;
    }

    .brand {
      width: 58px;
      height: 58px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: #111827;
      color: #fff;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 6vw, 34px);
      line-height: 1.15;
      font-weight: 750;
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin: 12px auto 28px;
      max-width: 320px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    #google-button {
      min-height: 44px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #status {
      min-height: 22px;
      margin-top: 18px;
      color: var(--muted);
      font-size: 13px;
    }

    #status.error {
      color: var(--danger);
    }

    .footer {
      margin-top: 24px;
      color: #9ca3af;
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 420px) {
      body {
        padding: 16px;
      }

      .login-card {
        padding: 34px 20px 26px;
        border-radius: 20px;
      }
    }
  </style>
</head>

<body>
  <main class="login-card" aria-labelledby="title">
    <div class="brand" aria-hidden="true">S</div>

    <h1 id="title">Welcome back</h1>

    <p class="subtitle">
      Sign in securely with your Google account to continue.
    </p>

    <div id="google-button" aria-label="Google Sign-In"></div>

    <div id="status" aria-live="polite"></div>

    <div class="footer">
      Secure Google Sign-In
    </div>
  </main>

  <script>
    "use strict";

    const CLIENT_ID =
      "88169519604-8l8enudk3ofqifabbmjug2cel8a11hg4.apps.googleusercontent.com";

    const PORTFOLIO_URL =
      "https://typebridge.42web.io";

    const LOGIN_LOG_URL =
      "https://script.google.com/macros/s/AKfycbxEkqlQdgxYcsVEzdKCuzfC3Hg1sztvwuQmmvgWXJNxelY2pnCqXbQgprkRIFW0rMjC/exec";

    const titleElement = document.getElementById("title");
    const buttonElement = document.getElementById("google-button");
    const statusElement = document.getElementById("status");

    let redirectStarted = false;

    function setStatus(message, isError = false) {
      statusElement.textContent = message;
      statusElement.classList.toggle("error", isError);
    }

    function redirectToPortfolio() {
      if (redirectStarted) {
        return;
      }

      redirectStarted = true;

      window.setTimeout(function () {
        window.location.href = PORTFOLIO_URL;
      }, 2000);
    }

    function decodeJwtPayload(jwt) {
      const parts = jwt.split(".");

      if (parts.length !== 3) {
        throw new Error("Invalid Google credential.");
      }

      let payload = parts[1]
        .replace(/-/g, "+")
        .replace(/_/g, "/");

      while (payload.length % 4 !== 0) {
        payload += "=";
      }

      const decoded = window.atob(payload);
      return JSON.parse(decoded);
    }

    function saveLogin(userData) {
      const payload = JSON.stringify({
        name: userData.name || "",
        email: userData.email || "",
        googleId: userData.sub || ""
      });

      /*
       * no-cors is intentional for Google Apps Script web apps.
       * We do not need to read the response; the Apps Script
       * endpoint receives the login event and stores it.
       */
      return fetch(LOGIN_LOG_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: payload,
        keepalive: true
      });
    }

    function handleCredentialResponse(response) {
      try {
        if (!response || !response.credential) {
          throw new Error("Google credential was not received.");
        }

        const userData = decodeJwtPayload(response.credential);
        const userName = userData.name || "User";

        titleElement.textContent = `Welcome ${userName}!`;
        buttonElement.style.display = "none";
        setStatus("Signed in successfully. Redirecting...");

        console.log("Google login successful:", {
          name: userData.name || "",
          email: userData.email || "",
          googleId: userData.sub || ""
        });

        /*
         * Start logging and redirect after exactly 2 seconds.
         * The redirect does not depend on reading the Apps Script response.
         */
        saveLogin(userData).catch(function (error) {
          console.error("Login logging request failed:", error);
        }).finally(function () {
          redirectToPortfolio();
        });

        /*
         * Safety fallback: even if a browser/network issue prevents
         * the fetch promise from settling, redirect after 2 seconds.
         */
        window.setTimeout(function () {
          redirectToPortfolio();
        }, 2000);

      } catch (error) {
        console.error("Google Sign-In error:", error);

        titleElement.textContent = "Sign-in failed";
        setStatus("Please try again.", true);
      }
    }

    function initializeGoogleSignIn() {
      if (
        !window.google ||
        !window.google.accounts ||
        !window.google.accounts.id
      ) {
        setStatus(
          "Google Sign-In is still loading. Please refresh the page.",
          true
        );
        return;
      }

      google.accounts.id.initialize({
        client_id: CLIENT_ID,
        callback: handleCredentialResponse
      });

      google.accounts.id.renderButton(
        buttonElement,
        {
          type: "standard",
          theme: "outline",
          size: "large",
          text: "signin_with",
          shape: "pill",
          logo_alignment: "left",
          width: 320
        }
      );

      setStatus("");
    }

    function waitForGoogleSDK(attempt = 0) {
      const maxAttempts = 100;

      if (
        window.google &&
        window.google.accounts &&
        window.google.accounts.id
      ) {
        initializeGoogleSignIn();
        return;
      }

      if (attempt >= maxAttempts) {
        setStatus(
          "Google Sign-In could not be loaded. Please refresh.",
          true
        );
        return;
      }

      window.setTimeout(function () {
        waitForGoogleSDK(attempt + 1);
      }, 100);
    }

    waitForGoogleSDK();
  </script>
</body>
</html>
